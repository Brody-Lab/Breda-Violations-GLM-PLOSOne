[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "violations-glm"
version = "0.1.0"
description = "Reproducible analyses for Breda et al., PLOS ONE"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "Jessica Breda" }]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "ruff>=0.13",
]
legacy = ["dill>=0.3.8"]

[project.scripts]
violations-glm = "violations_glm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
